name: Build Kiosk Browser EXE

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'kiosk_browser/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Depoyu Kopyala
      uses: actions/checkout@v4
      
    - name: Python'u Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Bağımlılıkları Yükle
      working-directory: ./kiosk_browser
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: EXE Oluştur
      working-directory: ./kiosk_browser
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "KioskBrowser" browser.py
        
    - name: EXE Dosyasını Zipleyip Yükle
      uses: actions/upload-artifact@v4
      with:
        name: KioskBrowser-Windows
        path: kiosk_browser/dist/KioskBrowser
