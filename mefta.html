<!DOCTYPE html>

    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
    <title>Defin Kaydı Detayı — Çiftlikköy Belediyesi</title>
    
    <!-- CSS & Fonts -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

            theme: {
                extend: {

                        brand: {

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-6xl mx-auto px-4 py-8">
        
        <template x-if="isLoading">
            <div class="flex flex-col items-center justify-center py-20 text-slate-500">

                <p class="font-medium">Kayıt bilgileri yükleniyor...</p>
            </div>
        </template>

        <template x-if="!isLoading && !record">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-12 text-center">

                    <i class="fa-solid fa-exclamation-triangle text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">Kayıt Bulunamadı</h2>

            </div>
        </template>

        <template x-if="!isLoading && record">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Sol Panel (Bilgiler) -->

                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 relative overflow-hidden">
                        <!-- Dekoratif Arka Plan Deseni -->
                        <div class="absolute top-0 right-0 -mt-10 -mr-10 opacity-5 pointer-events-none">

                        </div>
                        
                        <div class="flex flex-col md:flex-row justify-between items-start gap-6 relative z-10">
                            <div class="flex-1 w-full">

                    </div>

                        </div>
                        <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-y-6 gap-x-8">

                            <div>

                            <div>

                            </div>

                                </div>
                                <div>
                                    <p class="text-[11px] font-bold text-orange-800/60 uppercase mb-1">Telefon Numarası</p>
                                    <p class="text-lg font-bold text-orange-950" x-text="record.yakin_telefon || '—'"></p>

                                </div>
                            </div>

                </div>

                <!-- Sağ Panel (Harita & Medya) -->
                <div class="space-y-6">
                    
                    <!-- Harita Kartı -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                        <div class="bg-slate-50 px-5 py-4 border-b border-slate-200">

                        <div class="p-1 relative">

                        </div>
                        <div class="p-4 bg-slate-50 border-t border-slate-100" x-show="record.lat">

                                <i class="fa-solid fa-location-arrow"></i> Navigasyon Başlat

                    </div>

                    <!-- Görsel Kartı -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 px-5 py-4 border-b border-slate-200">
                            <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest flex items-center gap-2">

                        <div class="p-5">

                                            <img :src="img" class="w-full h-full object-cover rounded-xl shadow-sm border border-slate-200 cursor-zoom-in hover:opacity-90 transition" @click="openImageModal(img)" :alt="'Mezar Fotoğrafı ' + (idx+1)">
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template x-if="!parsedImages || parsedImages.length === 0">
                                <div class="bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl py-12 px-6 flex flex-col items-center">
                                    <div class="w-12 h-12 bg-slate-200 text-slate-400 rounded-full flex items-center justify-center mb-3">
                                        <i class="fa-solid fa-image-slash text-xl"></i>
                                    </div>

                                </div>
                            </template>
                        </div>

                    </div>

                    <!-- Paylaşım Kartı -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 px-5 py-4 border-b border-slate-200">
                            <h3 class="text-xs font-black text-slate-500 uppercase tracking-widest flex items-center gap-2">
                                <i class="fa-solid fa-share-nodes"></i> İlan & Paylaşım
                            </h3>
                        </div>
                        <div class="p-5 flex flex-col gap-3">
                            <button @click="shareOnWhatsApp()" class="w-full px-4 py-3 bg-emerald-500/10 text-emerald-600 font-bold rounded-xl hover:bg-emerald-500 hover:text-white transition flex items-center justify-center gap-2 text-sm border border-emerald-500/20">
                                <i class="fa-brands fa-whatsapp text-lg"></i> WhatsApp İle Paylaş
                            </button>
                            <button @click="copyLink()" class="w-full px-4 py-3 bg-brand-navy/10 text-brand-navy font-bold rounded-xl hover:bg-brand-navy hover:text-white transition flex items-center justify-center gap-2 text-sm border border-brand-navy/20">
                                <i class="fa-solid fa-link"></i> Sayfa Bağlantısını Kopyala
                            </button>
                        </div>
                    </div>



                </div>
            </div>
        </template>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-sm font-semibold text-slate-500">&copy; 2026 T.C. Çiftlikköy Belediyesi Park ve Bahçeler Müdürlüğü | Mezarlık Bilgi Sistemi</p>
        </div>
    </footer>

    <!-- Tam Ekran Görsel Modalı -->
    <div x-show="isImageModalOpen" class="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-4" x-cloak @click="closeImageModal()" @keydown.escape.window="closeImageModal()">
        <div class="relative bg-white p-2 rounded-2xl w-full max-w-4xl" @click.stop>
            <img :src="modalImageUrl" class="w-full h-auto max-h-[85vh] object-contain rounded-xl">
            <button @click="closeImageModal()" class="absolute -top-4 -right-4 w-10 h-10 bg-white text-slate-800 rounded-full flex items-center justify-center shadow-xl hover:bg-slate-100 hover:scale-105 transition border border-slate-200 text-lg">
                <i class="fa-solid fa-times"></i>
            </button>
        </div>
    </div>

    <!-- Alpine.js Application Logic -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('meftaApp', () => ({
                record: {},
                parsedImages: [],
                isLoading: true,
                isAdmin: localStorage.getItem('mbs_admin_logged') === 'true',
                isImageModalOpen: false,
                modalImageUrl: '',
                map: null,
                marker: null,

                async init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const recordId = urlParams.get('id');

                    if (!recordId) {
                        Swal.fire('Hata', 'Kayıt numarası eksik!', 'error').then(() => {
                            window.location.href = 'index.html';
                        });
                        return;
                    }

                    await this.fetchDetails(recordId);
                },

                async fetchDetails(id) {
                    this.isLoading = true;
                    try {
                        const res = await fetch(`api/index.php?action=vatandas_sorgu&id=${id}`);
                        const json = await res.json();

                        if (json.status === 'success' && json.data && json.data.length > 0) {
                            this.record = json.data[0];
                            document.title = `${this.record.ad} ${this.record.soyad} — Defin Kaydı (MBS)`;
                            
                            // Parse JSON images
                            if (this.record.gorsel_url) {
                                try {
                                    this.parsedImages = JSON.parse(this.record.gorsel_url);
                                    if (!Array.isArray(this.parsedImages)) this.parsedImages = [this.record.gorsel_url];
                                } catch(e) {
                                    this.parsedImages = [this.record.gorsel_url];
                                }
                            }

                            if (this.record.lat && this.record.lng) {
                                setTimeout(() => this.initMap(this.record.lat, this.record.lng), 100);
                            }
                        } else {
                            this.record = null;
                        }
                    } catch (err) {
                        console.error('Fetch error:', err);
                        this.record = null;
                    } finally {
                        this.isLoading = false;
                    }
                },

                initMap(lat, lng) {
                    if (this.map) {
                        this.map.remove();
                    }
                    this.map = L.map('meftaMap').setView([lat, lng], 17);
                    L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                        maxZoom: 20,
                        subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
                    }).addTo(this.map);
                    
                    this.marker = L.marker([lat, lng]).addTo(this.map)
                        .bindPopup(`<b>${this.record.ad} ${this.record.soyad}</b><br>Mezar Konumu`)
                        .openPopup();
                },

                openImageModal(url) {
                    this.modalImageUrl = url;
                    this.isImageModalOpen = true;
                },

                closeImageModal() {
                    this.isImageModalOpen = false;
                    this.modalImageUrl = '';
                },

                shareOnWhatsApp() {
                    if (!this.record) return;
                    const pageUrl = window.location.href;
                    const text = `*T.C. ÇİFTLİKKÖY BELEDİYESİ VEFAT İLANI*\n\n*Vefat Eden:* ${this.record.ad} ${this.record.soyad}\n*Vefat Tarihi:* ${this.record.olum_tarihi || '—'}\n*Mezarlık:* ${this.record.mezarlik_adi || 'Yeni Mezarlık'}\n*Ada/Parsel:* ${this.record.ada_no || '—'}. Ada / ${this.record.parsel_no || '—'}. Parsel\n\n*Detaylar:* ${pageUrl}`;
                    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
                },

                copyLink() {
                    navigator.clipboard.writeText(window.location.href).then(() => {
                        Swal.fire({
                            icon: 'success',
                            title: 'Kopyalandı',
                            text: 'Sayfa bağlantısı panoya kopyalandı.',
                            toast: true,
                            position: 'top-end',
                            showConfirmButton: false,
                            timer: 3000
                        });
                    });
                },

                downloadPdf() {
                    if (this.record && this.record.id) {
                        window.open(`api/index.php?action=export_tekli_pdf&id=${this.record.id}&admin_key=1`, '_blank');
                    }
                },

                editRecord() {
                    if (window.parent && window.parent !== window && window.parent.document.querySelector('[x-data="adminApp"]')) {
                        // We are inside the iframe modal! 
                        const adminAppEl = window.parent.document.querySelector('[x-data="adminApp"]');
                        if(adminAppEl.__x) {
                            adminAppEl.__x.$data.closePreviewModal();
                            adminAppEl.__x.$data.openEditModal(this.record.id);
                        }
                    } else {
                        // Opened directly in tab
                        window.location.href = `admin/index.html`;
                    }
                },

                async deleteRecord() {
                    if (window.parent && window.parent !== window && window.parent.document.querySelector('[x-data="adminApp"]')) {
                        // We are inside the iframe modal! Trigger parent's delete modal directly
                        const adminAppEl = window.parent.document.querySelector('[x-data="adminApp"]');
                        if(adminAppEl.__x) {
                            adminAppEl.__x.$data.closePreviewModal();
                            adminAppEl.__x.$data.deleteRecord(this.record.id);
                        }
                    } else {
                        // Fallback if accessed directly
                        Swal.fire('Hata', 'Kayıt silme işlemi yalnızca Yönetim Paneli tablosu üzerinden yapılabilir.', 'warning');
                    }
                }
            }));
        });
    </script>
</body>
</html>
