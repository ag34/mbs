<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBS Yönetim Paneli - Giriş</title>
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { brand: { navy: '#1e3a8a' } } }
            }
        }
    </script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen relative" x-data="loginApp">
    <!-- Background Gradient -->
    <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-brand-navy to-slate-900 opacity-90 z-0"></div>

    <div class="relative z-10 w-full max-w-md bg-white p-8 rounded-3xl shadow-2xl mx-4">
        
        <!-- STEP 1: LOGIN -->
        <div x-show="step === 1" x-transition.opacity>
            <div class="text-center mb-8">
                <div class="flex justify-center mb-4">
                    <div class="w-20 h-20 bg-slate-50 rounded-full flex items-center justify-center border border-slate-100 shadow-sm overflow-hidden">
                        <img src="../assets/img/logo.svg" onerror="this.onerror=null; this.parentElement.innerHTML='<i class=\'fa-solid fa-building-columns text-4xl text-brand-navy\'></i>';" alt="Logo" class="w-full h-full object-cover p-2">
                    </div>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-800">MBS Yönetim Paneli</h1>
                <p class="text-slate-500 text-sm mt-2">Lütfen sicil numaranız ve şifrenizle giriş yapın</p>
            </div>

            <form @submit.prevent="request2FA" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Kullanıcı Adı (Sicil No)</label>
                    <input type="text" x-model="username" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-navy outline-none transition" placeholder="Örn: admin" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Şifre</label>
                    <input type="password" x-model="password" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-navy outline-none transition" placeholder="••••••••" required>
                </div>
                
                <button type="submit" :disabled="isLoading" class="w-full bg-brand-navy text-white font-semibold py-3.5 rounded-xl hover:bg-blue-800 transition shadow-lg mt-6 flex justify-center items-center gap-2">
                    <span x-show="!isLoading">Giriş Yap</span>
                    <svg x-show="isLoading" x-cloak class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </form>
        </div>

        <!-- STEP 1.5: 2FA CHOICE -->
        <div x-show="step === 1.5" x-cloak x-transition.opacity>
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-100 text-brand-navy rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-800">Doğrulama Yöntemi</h1>
                <p class="text-slate-500 text-sm mt-2">Güvenliğiniz için doğrulama kodunu nereye gönderelim?</p>
            </div>

            <div class="space-y-4">
                <button x-show="availableMethods.includes('sms')" @click="send2FA('sms')" :disabled="isLoading" class="w-full bg-slate-50 border border-slate-200 text-slate-700 font-semibold py-4 rounded-xl hover:bg-slate-100 transition shadow-sm flex items-center justify-center gap-3">
                    <svg x-show="!isLoading" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-navy" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>
                    <svg x-show="isLoading" class="animate-spin h-5 w-5 text-brand-navy" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span>SMS ile Gönder (<span x-text="maskedPhone"></span>)</span>
                </button>

                <button x-show="availableMethods.includes('email')" @click="send2FA('email')" :disabled="isLoading" class="w-full bg-slate-50 border border-slate-200 text-slate-700 font-semibold py-4 rounded-xl hover:bg-slate-100 transition shadow-sm flex items-center justify-center gap-3">
                    <svg x-show="!isLoading" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-brand-navy" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
                    <svg x-show="isLoading" class="animate-spin h-5 w-5 text-brand-navy" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span>E-Posta ile Gönder (<span x-text="maskedEmail"></span>)</span>
                </button>
            </div>
            <div class="text-center mt-6">
                <button type="button" @click="step = 1" class="text-sm text-brand-navy hover:underline font-medium">Geri Dön</button>
            </div>
        </div>

        <!-- STEP 2: 2FA OTP -->
        <div x-show="step === 2" x-cloak x-transition.opacity>
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-100 text-brand-navy rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-800">2 Adımlı Doğrulama</h1>
                <p class="text-slate-500 text-sm mt-2" x-html="get2faMessage()"></p>
            </div>

            <form @submit.prevent="verify2FA" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1 text-center">Doğrulama Kodu</label>
                    <input type="text" x-model="otp" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" class="w-full text-center tracking-widest text-2xl px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-navy outline-none transition" placeholder="******" required maxlength="6">
                </div>
                
                <button type="submit" :disabled="isLoading" class="w-full bg-brand-navy text-white font-semibold py-3.5 rounded-xl hover:bg-blue-800 transition shadow-lg mt-6 flex justify-center items-center gap-2">
                    <span x-show="!isLoading">Doğrula ve Giriş Yap</span>
                    <svg x-show="isLoading" x-cloak class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>

                <div class="text-center mt-4">
                    <button type="button" @click="step = 1" class="text-sm text-brand-navy hover:underline font-medium">Geri Dön</button>
                </div>
            </form>
        </div>

    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('loginApp', () => ({
                step: 1, // 1: Login, 1.5: 2FA Choice, 2: OTP
                username: '',
                password: '',
                otp: '',
                availableMethods: [],
                maskedPhone: '',
                maskedEmail: '',
                smsSent: false,
                emailSent: false,
                isLoading: false,

                get2faMessage() {
                    if (this.smsSent && this.emailSent) {
                        return `Güvenliğiniz için <b>${this.maskedPhone}</b> telefonunuza ve <b>${this.maskedEmail}</b> e-posta adresinize gönderilen 6 haneli kodu girin.`;
                    } else if (this.emailSent) {
                        return `Güvenliğiniz için <b>${this.maskedEmail}</b> e-posta adresinize gönderilen 6 haneli kodu girin.`;
                    } else {
                        return `Güvenliğiniz için <b>${this.maskedPhone}</b> numaralı telefonunuza gönderilen 6 haneli kodu girin.`;
                    }
                },

                async request2FA() {
                    this.isLoading = true;
                    try {
                        const res = await fetch('../api/index.php?action=login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.username,
                                password: this.password,
                                action_step: 'request_2fa'
                            })
                        });
                        const data = await res.json();
                        if (data.status === '2fa_choice_required') {
                            this.maskedPhone = data.user.telefon || '';
                            this.maskedEmail = data.user.eposta || '';
                            this.availableMethods = data.available_methods || [];
                            
                            if (this.availableMethods.length > 0) {
                                this.step = 1.5;
                            } else {
                                Swal.fire('Hata', 'Kullanılabilir doğrulama yöntemi bulunamadı.', 'error');
                            }
                        } else {
                            Swal.fire('Hata', data.message || 'Kullanıcı adı veya şifre hatalı', 'error');
                        }
                    } catch (error) {
                        Swal.fire('Hata', 'Sunucuya bağlanılamadı.', 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },

                async send2FA(method) {
                    this.isLoading = true;
                    try {
                        const res = await fetch('../api/index.php?action=login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.username,
                                password: this.password,
                                action_step: 'send_2fa',
                                method: method
                            })
                        });
                        const data = await res.json();
                        if (data.status === '2fa_required') {
                            this.smsSent = data.sms_status === 'sent';
                            this.emailSent = data.email_status === 'sent';
                            this.step = 2;
                        } else {
                            Swal.fire('Hata', data.message || 'Doğrulama kodu gönderilemedi', 'error');
                        }
                    } catch (error) {
                        Swal.fire('Hata', 'Sunucuya bağlanılamadı.', 'error');
                    } finally {
                        this.isLoading = false;
                    }
                },

                async verify2FA() {
                    this.isLoading = true;
                    try {
                        const res = await fetch('../api/index.php?action=login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.username,
                                password: this.password,
                                otp: this.otp,
                                action_step: 'verify_2fa'
                            })
                        });
                        const data = await res.json();
                        if (data.status === 'success') {
                            localStorage.setItem('mbs_auth_token', data.token);
                            localStorage.setItem('mbs_token', data.token);
                            localStorage.setItem('mbs_admin_logged', 'true');
                            localStorage.setItem('mbs_admin_user', data.user.username);
                            localStorage.setItem('mbs_admin_role', data.user.role); // In api it's role, not yetki_seviyesi
                            localStorage.setItem('mbs_admin_name', data.user.ad_soyad);
                            localStorage.setItem('mbs_can_add', data.user.can_add);
                            localStorage.setItem('mbs_can_edit', data.user.can_edit);
                            localStorage.setItem('mbs_can_delete', data.user.can_delete);
                            window.location.href = 'index.html';
                        } else {
                            Swal.fire('Hata', data.message || 'OTP Hatalı', 'error');
                        }
                    } catch (error) {
                        Swal.fire('Hata', 'Sunucuya bağlanılamadı.', 'error');
                    } finally {
                        this.isLoading = false;
                    }
                }
            }));
        });
    </script>
</body>
</html>
